# Netlify configuration — SureSky Inc. / SureSky Homes
# Static site: no build step, no dependencies.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Security headers (audited by most SEO / site-health tools)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------------------------------------------------------------------------
# Caching — HTML revalidates, static assets cache hard
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Logos, favicons and OG cards — content-stable, cache hard
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Pretty URLs — /homes resolves to /homes.html
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/homes"
  to = "/homes.html"
  status = 200

[[redirects]]
  from = "/roofing"
  to = "/homes.html"
  status = 301
