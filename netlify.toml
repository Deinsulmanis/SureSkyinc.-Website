# Netlify configuration — SureSky Inc. / SureSky Homes
# Static site: no build step, no dependencies.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Security headers (audited by most SEO / site-health tools)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------------------------------------------------------------------------
# Caching — HTML revalidates, static assets cache hard
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# styles.css and script.js are NOT content-hashed (no build step), so they
# must revalidate on every load — otherwise a deploy is invisible to anyone
# who already has them cached. Revalidation is cheap: Netlify returns 304
# via ETag when nothing changed.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Logos, favicons and OG cards get edited in place under the same filename,
# so they must NOT be immutable — that pins a stale image for a year. One day
# of caching plus revalidation keeps them fast without stranding an update.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Fonts genuinely never change under this filename — safe to pin hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Pretty URLs — /homes resolves to /homes.html
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/homes"
  to = "/homes.html"
  status = 200

[[redirects]]
  from = "/roofing"
  to = "/homes.html"
  status = 301
